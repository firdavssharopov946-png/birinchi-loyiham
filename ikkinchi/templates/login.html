<!DOCTYPE html>
<html>
<head>
    <title>Kirish - Mening Loyiham</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 400px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="text-center mb-4">Tizimga kirish</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Login</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label">Parol</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary w-100">Kirish</button>
        </form>
    </div>
</body>
</html>
