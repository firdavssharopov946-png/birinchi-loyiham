{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow border-0" style="border-radius: 15px; max-width: 500px; margin: auto;">
        <div class="card-header bg-primary text-white text-center py-3" style="border-radius: 15px 15px 0 0;">
            <h4 class="mb-0">Yangi mahsulot qo'shish</h4>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="nomi" placeholder="Mahsulot nomi" required>
                <input type="number" name="narxi" placeholder="Narxi" required>
                <input type="number" name="miqdori" placeholder="Miqdori" required> 
                <button type="submit">Saqlash</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
